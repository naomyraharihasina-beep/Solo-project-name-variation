<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Variation Project</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav class="navbar">
    <h1 class="nav-brand"><b>Welcome to this Project 😉</b></h1>
    </nav>

    <main class="container">
        <h2>Name Variation</h2>
        <div>
            <label class="label" for="your-name">Enter your surname</label>
            <input type="text" class="input" placeholder="Your surname" id="your-name" autocomplete="off">
        </div>

        <table class="table" border="1">
            <thead>
                <tr>
                    <th width="200px">Variation</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Number of characters</td>
                    <td id="answer1"></td>
                </tr>
                <tr>
                    <td>Lower case</td>
                    <td id="answer2"></td>
                </tr>
                <tr>
                    <td>Upper case</td>
                    <td id="answer3"></td>
                </tr>
            </tbody>
        </table>
    </main>

    <script type="module" src="index.js"></script>
</body>
</html>
